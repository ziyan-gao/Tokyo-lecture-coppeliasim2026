# Usage (CoppeliaSim must already be running on the host):
#   docker compose build
#   docker compose run --rm lab python lecture1/zmq_stepping.py
services:
  lab:
    build: ./docker
    image: coppeliasim-course-lab
    working_dir: /work
    volumes:
      - ./scripts:/work
    environment:
      COPPELIASIM_HOST: host.docker.internal
      COPPELIASIM_PORT: "23000"
    # Needed on Linux; Docker Desktop (Windows/macOS) already provides it.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    stdin_open: true
    tty: true
